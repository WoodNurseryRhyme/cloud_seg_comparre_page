  <iframe id="viewer" title="双期影像及 GT、R18、SemDINO 同步卷帘"></iframe>
  <script>
    const picker=document.getElementById('sample');
    function show(){
      const url='pages/'+picker.value+'.html';document.getElementById('viewer').src=url;
      document.getElementById('separate').href=url;
      document.getElementById('counter').textContent=(picker.selectedIndex+1)+' / '+picker.options.length;
      document.getElementById('previous').disabled=picker.selectedIndex===0;
      document.getElementById('next').disabled=picker.selectedIndex===picker.options.length-1;
    }
    picker.addEventListener('change',show);
    document.getElementById('previous').addEventListener('click',()=>{if(picker.selectedIndex>0){picker.selectedIndex--;show();}});
    document.getElementById('next').addEventListener('click',()=>{if(picker.selectedIndex<picker.options.length-1){picker.selectedIndex++;show();}});
    show();
  </script>
